<main id="apply-success-view" class="view-section">
      <div class="login-card" style="max-width:550px; text-align:center;">
        <div style="width:72px; height:72px; border-radius:50%; background:var(--accent-green-bg); color:var(--accent-green); border:2px solid var(--accent-green); display:flex; align-items:center; justify-content:center; font-size:2.5rem; margin:0 auto 1.5rem auto; box-shadow:0 0 15px var(--accent-green-bg);">
          ✓
        </div>
        
        <h2 class="section-title">Application Submitted!</h2>
        <p style="color:var(--text-secondary); font-size:0.9rem; margin-top:0.25rem; margin-bottom:2rem;">
          Your bid proposal has been signed and queued on the ledger.
        </p>

        <div style="background:rgba(0,0,0,0.2); border:1px solid var(--border-color); border-radius:10px; padding:1.5rem; text-align:left; margin-bottom:2rem; font-size:0.85rem; display:flex; flex-direction:column; gap:0.75rem;">
          <div style="display:flex; justify-content:space-between; border-bottom:1px solid var(--border-color); padding-bottom:0.5rem;">
            <span style="color:var(--text-muted);">Reference Number:</span>
            <strong style="font-family:monospace; color:var(--accent-cyan);" id="success-ref-no">GT-APP-293A</strong>
          </div>
          <div style="display:flex; justify-content:space-between;">
            <span style="color:var(--text-muted);">Tender Name:</span>
            <strong style="color:white;" id="success-tender-name">Solar Power Grid</strong>
          </div>
          <div style="display:flex; justify-content:space-between;">
            <span style="color:var(--text-muted);">Bid Projection:</span>
            <strong style="color:var(--accent-green);" id="success-bid-val">₹12,00,00,000 INR</strong>
          </div>
          <div style="display:flex; justify-content:space-between;">
            <span style="color:var(--text-muted);">Signee Identity:</span>
            <strong style="color:white;" id="success-signee">Jane Doe (eSignet IDA)</strong>
          </div>
        </div>

        <div style="display:flex; gap:1rem; flex-direction:column;">
          <button class="btn btn-primary" onclick="switchView('vendor-portal-view')">Go to Vendor Dashboard</button>
          <div style="display:flex; gap:0.5rem; justify-content:center;">
            <button class="btn btn-outline" style="flex:1; font-size:0.8rem; padding:0.5rem 1rem;" id="success-view-app-btn">View Applications</button>
            <button class="btn btn-outline" style="flex:1; font-size:0.8rem; padding:0.5rem 1rem;" id="success-browse-btn">Browse More</button>
          </div>
        </div>
      </div>
    </main>
